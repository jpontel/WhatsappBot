[tool.poetry]
name = "agente"
version = "0.1.0"
description = "Agente ADK que orquestra comandos do whatsapp-bot via MCP"
authors = ["jose <jose.pontel@waproject.com.br>"]
readme = "README.md"
# Sem pacote instalável: rodamos via PYTHONPATH=/app/src (Docker) e os módulos
# de topo vivem direto em src/ (config, main, api/, client/, tools/, repo/, shared/).
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# No ADK 2.x, suporte a MCP virou extra (`mcp`) — sem ele o import de
# StreamableHTTPConnectionParams quebra (`No module named 'mcp'`). SQLAlchemy
# também saiu do core (era core no 1.x) e o DatabaseSessionService precisa dela;
# adicionamos `sqlalchemy` direto em vez do extra `db` (que arrastaria o dialeto
# pesado do Cloud Spanner, sem uso aqui — nosso backend é SQLite).
google-adk = { version = ">=2.3,<3.0", extras = ["mcp"] }
sqlalchemy = ">=2,<3"
fastapi = ">=0.118,<1.0"
uvicorn = { extras = ["standard"], version = ">=0.32,<1.0" }
pydantic = ">=2.9,<3.0"
pydantic-settings = ">=2.6,<3.0"
httpx = ">=0.28,<1.0"
sqlite-vec = "^0.1.9"
# Memória visual (reconhecimento facial). insightface compila uma extensão no
# build (precisa de build-essential no Dockerfile); onnxruntime/opencv vêm como
# wheels. numpy fixado em <2 por compatibilidade com o insightface 0.7.x.
insightface = "^0.7.3"
# Limitado a <1.24: 1.24+ não publica wheel p/ macOS-arm64+py311 (quebra o
# `poetry install` de dev). 1.23.2 tem wheel p/ macOS e linux — instala nos dois.
onnxruntime = ">=1.19,<1.24"
opencv-python-headless = "^4.10"
numpy = ">=1.26,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.7"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
